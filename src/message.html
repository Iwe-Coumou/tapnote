<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tapnote</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%8C</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Parisienne&display=swap" rel="stylesheet">
  <style>/*__STYLES__*/</style>
</head>
<body>
  <div class="letter">
    <span class="mark">for Tina</span>
    <p id="message"></p>
    <div class="rule"></div>

    <div class="actions">
      <a id="song-link" class="action-link song-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button type="button" id="reply-toggle" class="action-link">reply</button>
    </div>

    <form id="reply-form" class="reply">
      <div id="reply-controls">
        <input id="reply-input" class="reply-input" type="text" placeholder="write something back..." maxlength="300" />
        <div class="emoji-row">
          <button type="button" class="emoji-btn">❤️</button>
          <button type="button" class="emoji-btn">😂</button>
          <button type="button" class="emoji-btn">🥹</button>
          <button type="button" class="emoji-btn">😘</button>
        </div>
        <button type="submit" id="reply-send" class="reply-send">Send</button>
      </div>
      <p id="reply-status" class="reply-status"></p>
    </form>
  </div>
  <script>
    const currentMessage = __MESSAGE_JSON__;
    document.getElementById("message").textContent = currentMessage;

    const song = __SONG_JSON__;
    if (song) {
      const songLink = document.getElementById("song-link");
      songLink.href = song.url;
      songLink.textContent = "🎵 " + (song.title || "song");
      songLink.style.display = "inline";
    }

    const replyForm = document.getElementById("reply-form");
    const replyToggle = document.getElementById("reply-toggle");
    const replyControls = document.getElementById("reply-controls");
    const replyInput = document.getElementById("reply-input");
    const replySend = document.getElementById("reply-send");
    const replyStatus = document.getElementById("reply-status");
    const emojiButtons = document.querySelectorAll(".emoji-btn");

    replyToggle.addEventListener("click", () => {
      replyToggle.style.display = "none";
      replyControls.style.display = "flex";
      replyInput.focus();
    });

    function setReplyControlsDisabled(disabled) {
      replyInput.disabled = disabled;
      replySend.disabled = disabled;
      emojiButtons.forEach((button) => { button.disabled = disabled; });
    }

    async function sendReply(text) {
      if (!text) return;
      setReplyControlsDisabled(true);
      replyStatus.textContent = "Sending...";
      try {
        const res = await fetch("/reply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, repliedTo: currentMessage }),
        });
        if (!res.ok) throw new Error("request failed");

        // Only one reply per tap: once it's sent, replace the whole reply
        // UI with a simple confirmation so it can't be sent again.
        replyControls.style.display = "none";
        replyStatus.textContent = "Reply sent 💌";
        replyStatus.classList.add("reply-sent");
      } catch {
        replyStatus.textContent = "Couldn't send — try again?";
        setReplyControlsDisabled(false);
      }
    }

    replyForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendReply(replyInput.value.trim());
    });

    emojiButtons.forEach((button) => {
      button.addEventListener("click", () => sendReply(button.textContent));
    });
  </script>
</body>
</html>
